<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">

    <!-- 모바일에서도 화면 크기가 맞도록 설정 -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- FastAPI에서 전달한 title 값 사용 -->
    <title>{{ title }}</title>

    <!-- static 폴더의 CSS 연결 -->
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>

    <header>
        <h1>K-POP DATA LAB</h1>
        <p>Spotify와 YouTube 데이터를 비교하는 데이터 저널리즘 실습</p>
    </header>

    <main>

        <section class="card">
            <h2>🎵 Spotify</h2>
            <p>K-POP 곡의 주간 차트 순위와 스트리밍을 확인합니다.</p>
            <a href="/spotify">Spotify Data</a>
        </section>

        <section class="card">
            <h2>▶ YouTube</h2>
            <p>뮤직비디오 조회수, 좋아요, 댓글을 확인합니다.</p>
            <a href="/youtube">YouTube Data</a>
        </section>

        <section class="card">
            <h2>📊 Compare</h2>
            <p>Spotify와 YouTube 데이터를 한 화면에서 비교합니다.</p>
            <a href="/compare">Compare Data</a>
        </section>

    </main>

</body>

</html>
