<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>K-POP DATA LAB · 기사 검수</title><link rel="stylesheet" href="/static/editorial.css"></head><body><main><h1>기사 · 검수 관리</h1><p id="message" role="status"></p><section><h2>승인된 기사</h2><div id="published"></div></section><section id="workspace" hidden><h2>기사 목록 · 검수 대기</h2><button id="new">새 초안</button><div id="list"></div><div class="columns"><form id="article-form"><h3 id="status">새 초안</h3><label>제목<input id="title" required maxlength="300"></label><label>차트 주차 종료일<input id="week" type="date" required value="2026-10-08"></label><label>본문<textarea id="body" required maxlength="100000"></textarea></label><button id="save">초안 저장</button><button type="button" id="preview">현재 선택곡 무료 초안 가져오기</button><button type="button" id="submit">검수 요청</button><button type="button" id="withdraw">기사 철회</button></form><section><h3>Fact Sheet 근거 대조</h3><button id="facts">해당 주차 근거 확인</button><p id="fresh"></p><pre id="evidence"></pre></section></div><form id="review-form" hidden><h3>편집자 검수</h3><label><input type="checkbox" id="numbers"> 수치가 Fact Sheet·원본과 일치</label><label><input type="checkbox" id="period_units"> 날짜·집계 기간·단위·지역·플랫폼 정확</label><label><input type="checkbox" id="no_unsupported_claims"> 근거 없는 인과·전망·과장 없음</label><label><input type="checkbox" id="sources"> 출처·기준 시점 명확</label><label>검수 의견<textarea id="comment" required maxlength="5000"></textarea></label><button value="APPROVED">승인</button><button value="ON_HOLD">보류</button></form><h3>검수·수정 이력</h3><pre id="history"></pre></section><section id="admin" hidden><h2>사용자 역할 관리</h2><p>역할 변경 후 해당 사용자는 다시 로그인해야 합니다.</p><div id="users"></div></section></main><script src="/static/account_status.js"></script><script src="/static/editorial.js"></script></body></html>
